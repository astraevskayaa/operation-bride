<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2b0710">
  <title>Постановление семейного совета</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <audio id="music" preload="auto" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <main class="app">
    <section class="screen active loading-screen" id="loadingScreen">
      <div class="velvet-noise"></div>
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <div class="loading-inner">
        <div class="small-label">Официальное обращение</div>
        <div class="crest">С</div>
        <h1>Семейный совет</h1>

        <div class="loading-copy">
          <p id="loadingStatus">Созываем семейный совет…</p>
          <div class="progress">
            <div id="progressFill"></div>
          </div>
        </div>

        <div class="loading-result" id="loadingResult">
          <div class="stamp-mark">РЕШЕНИЕ<br>ПРИНЯТО</div>
          <p>Постановление готово.</p>
        </div>

        <button class="action-card light-card" id="musicButton">
          <span class="button-icon">♫</span>
          <span>
            <b>Включить атмосферу</b>
            <small>Музыка начнётся после нажатия</small>
          </span>
          <span class="arrow">→</span>
        </button>

        <button class="action-card gold-card hidden" id="openButton">
          <span>
            <b>Открыть постановление</b>
            <small>Совет старших уже всё решил</small>
          </span>
          <span class="arrow">→</span>
        </button>
      </div>
    </section>

    <section class="screen story-screen" id="storyScreen">
      <div class="velvet-noise"></div>
      <div class="ornament-top">✦ ◆ ✦</div>

      <div class="story-content" id="storyContent"></div>

      <div class="bottom-panel">
        <div class="progress-dots" id="progressDots"></div>
        <button class="action-card gold-card" id="nextButton">
          <span>
            <b>Далее</b>
            <small id="nextHint">Слушаю внимательно</small>
          </span>
          <span class="arrow">→</span>
        </button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
